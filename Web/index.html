<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC</title>
    <link rel="stylesheet" href = "style.css">
</head>
<body>

    <!--HEADER-->
    <header>
    <img src="logo.png" alt="ARClogo" class="arc-logo" width="50px" height="50px">
    </header>

    <section>
        <div>
            <form action = "/.server">
                <button type="button">Login</button>
                <button type="button">Register</button>

                <!--MENU BAR-->

                <select aria-selected = "☰">
                    <option >+ New Chats</option>
                    <option>Plugins</option>
                    <option>Recent Chats</option>
                </select>

                <br>

                <!--Text Area for User-->

            <h3><i>How can Help you, Today!</i></h3>
                <label for = "text"></label>
                <textarea
                id = "text" 
                placeholder = "Ask Anthing, ARC is here!" 
                rows="5" 
                cols="50"></textarea>

                <button type = "submit">Submit</button>
                <button type = "reset">Reset</button>
                </select>


                <br>

                <!--Button -->
                <input type="file">
                <select name = "format", id = "format">
                    <option>Format</option>
                    <option id = ".pdf">.PDF</option>
                    <option id = ".jpg">.JPEG/.PNG</option>





        </div>
    </section>
    
    
</body>
</html>
