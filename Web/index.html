<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC</title>
    <link rel="stylesheet" href = "style.css">
</head>
<body>

    <!--HEADER-->
    <header>
    <h1>ARC</h1>
    <hr>
    </header>

    <section>
        <div>
            <form action = "/.server">
                <button type="button">Login</button>
                <button type="button">Register</button>

                <h2> Think <i>Anything,</i> Build <i>Everything.</i></h2>

                <button> + New Chats</button>
                <select name = "plg">
                    <option selected>ARC 1.1</option>
                    <option>ARC 1.9 Pro</option>
                </select>
                <select name = "opt" id = "opt">
                    <option>History</option>
                    <option id = "opt">Recent Chats</option>
                    <option id = "opt">Previous Chats</option>
                </select>

                <br>

                <!--Text Area for User-->

            <h3><i>How can Help you, Today!</i></h3>
                <labels for = "text"></labels>
                <textarea
                id = "text" 
                placeholder = "Ask Anthing, ARC is here!" 
                rows="5" 
                cols="50"></textarea>

                <button type = "submit">Submit</button>
                <button type = "reset">Reset</button>
                </select>


                <br>

                <!--Button -->
                <input type="file">
                <select name = "format", id = "format">
                    <option>Format</option>
                    <option id = ".pdf">.PDF</option>
                    <option id = ".jpg">.JPEG/.PNG</option>





        </div>
    </section>
    
    
</body>
</html>
